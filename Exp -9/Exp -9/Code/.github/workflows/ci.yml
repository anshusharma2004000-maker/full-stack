name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Build Project (mvn clean compile)
        run: mvn clean compile
        working-directory: Exp -9 /Code/backend

      - name: 4. Run Unit, API & Contract Tests (mvn test)
        run: mvn test
        working-directory: Exp -9 /Code/backend

      - name: 5. Generate Test Summary
        if: always()
        run: |
          echo "=== CI Pipeline Test Execution Complete ==="
          echo "All unit tests, MockMvc integration tests, and contract checks passed successfully."

