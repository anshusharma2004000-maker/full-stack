<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JWT Auth Demo</title>
    <style>
      :root{--bg:#f4f7fb;--card:#ffffff;--muted:#6b7280;--accent:#2563eb}
      body { font-family: Inter, system-ui, Arial; background: linear-gradient(180deg,#eef2ff 0%, #f8fafc 100%); color:#0f172a; }
      .container { max-width: 900px; margin: 2.5rem auto; padding: 1.25rem; }
      header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem }
      .logo { width:56px; height:56px; background:var(--accent); color:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px }
      h1{margin:0;font-size:1.25rem}
      p.lead{margin:0;color:var(--muted)}
      .card { background:var(--card); box-shadow:0 6px 18px rgba(15,23,42,0.06); padding:1rem; margin-bottom:1rem; border-radius:10px; }
      input, textarea { width: 100%; padding: .6rem; margin-top: .5rem; border:1px solid #e6eef8; border-radius:6px }
      button { padding: .55rem 1rem; margin-top: .5rem; border-radius:8px; background:var(--accent); color:#fff; border:0 }
      .muted{color:var(--muted)}
      .row{display:flex;gap:1rem}
      .col{flex:1}
      .role-badge{display:inline-block;padding:.25rem .5rem;border-radius:999px;background:#eef2ff;color:var(--accent);font-weight:600;margin-left:.5rem}
      .small{font-size:.9rem}
      .autofill { margin-left:.5rem; background:#eef2ff; color:var(--accent); border:0; padding:.25rem .5rem; border-radius:6px }
    </style>
  </head>
  <body>
    <h1>JWT Authentication Demo</h1>

    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
      const e = React.createElement;

      function decodeJwtPayload(token) {
        try {
          const parts = token.split('.');
          if (parts.length !== 3) return null;
          const payload = parts[1];
          const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
          return JSON.parse(decoded);
        } catch (err) {
          return null;
        }
      }

      function useAuth() {
        const [token, setToken] = React.useState(localStorage.getItem('jwt_token'));
        const [profile, setProfile] = React.useState(token ? decodeJwtPayload(token) : null);
        const [platform, setPlatform] = React.useState(localStorage.getItem('selected_platform') || 'web');

        React.useEffect(() => {
          if (token) {
            localStorage.setItem('jwt_token', token);
            setProfile(decodeJwtPayload(token));
          } else {
            localStorage.removeItem('jwt_token');
            setProfile(null);
          }
        }, [token]);

        React.useEffect(() => {
          localStorage.setItem('selected_platform', platform);
        }, [platform]);

        function logout() { setToken(null); }

        return { token, setToken, profile, logout, platform, setPlatform };
      }

      function App() {
        const { token, setToken, profile, logout, platform, setPlatform } = useAuth();
        return e('div', { className: 'container' },
          e('header', null,
            e('div', { className: 'logo' }, 'JS'),
            e('div', null, e('h1', null, 'JWT Auth Demo'), e('p', { className: 'lead' }, 'Demonstration of token-based auth, roles, and protected UI'))
          ),
          !token ? e(LoginForm, { onLogin: setToken }) : e('div', null,
            e('div', { className: 'card row' },
              e('div', { className: 'col' }, e('strong', null, `Signed in as ${profile?.name || profile?.username}`), e('span', { className: 'role-badge' }, profile?.role || 'user')),
              e('div', { style: { textAlign: 'right' } },
                e('label', { className: 'small muted' }, 'Platform:'),
                e(PlatformPicker, { platform, setPlatform }),
                e('button', { onClick: logout, style: { marginLeft: '12px' } }, 'Sign out')
              )
            ),
            profile?.role === 'viewer' ? e('div', { className: 'card' }, e('h3', null, 'View-only account'), e('p', null, 'This account cannot create posts.')) : e(PostComposer, { token, platform }),
            e(PostList, { token })
          )
        );
      }

      function PlatformPicker({ platform, setPlatform }) {
        const saved = JSON.parse(localStorage.getItem('platforms_list') || 'null');
        const [items, setItems] = React.useState(saved || ['twitter','instagram','facebook','linkedin']);
        const [newName, setNewName] = React.useState('');

        React.useEffect(() => {
          localStorage.setItem('platforms_list', JSON.stringify(items));
        }, [items]);

        function addPlatform() {
          const v = (newName || '').toString().trim().toLowerCase();
          if (!v) return;
          if (items.includes(v)) { setPlatform(v); setNewName(''); return; }
          setItems(prev => [v, ...prev].slice(0, 20));
          setPlatform(v);
          setNewName('');
        }

        return e('span', null,
          e('select', { value: platform, onChange: ev => setPlatform(ev.target.value), style: { marginLeft: '8px', padding: '.4rem', borderRadius: '6px' } },
            items.map(it => e('option', { key: it, value: it }, it.charAt(0).toUpperCase() + it.slice(1)))
          ),
          e('input', { placeholder: 'Add platform', value: newName, onChange: ev => setNewName(ev.target.value), style: { marginLeft: '8px', padding: '.35rem', borderRadius: '6px', width: '120px' } }),
          e('button', { type: 'button', onClick: addPlatform, style: { marginLeft: '6px', padding: '.35rem .6rem', background: '#10b981' } }, 'Add')
        );
      }

      function LoginForm({ onLogin }) {
        const [username, setUsername] = React.useState('admin');
        const [password, setPassword] = React.useState('adminpass');
        const [error, setError] = React.useState(null);

        async function submit(evt) {
          evt.preventDefault();
          setError(null);
          try {
            const res = await fetch('/api/login', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ username, password })
            });
            const body = await res.json();
            if (!res.ok) throw new Error(body.error || 'Login failed');
            onLogin(body.token);
          } catch (err) {
            setError(err.message);
          }
        }

        function fill(user) {
          if (user === 'admin') { setUsername('admin'); setPassword('adminpass'); }
          if (user === 'editor') { setUsername('editor'); setPassword('editorpass'); }
          if (user === 'viewer') { setUsername('viewer'); setPassword('viewerpass'); }
        }

        return e('form', { onSubmit: submit, className: 'card' },
          e('h2', null, 'Login'),
          e('div', { className: 'small muted' }, 'Sample accounts:' , e('button', { type: 'button', className: 'autofill', onClick: () => fill('admin') }, 'admin'), e('button', { type: 'button', className: 'autofill', onClick: () => fill('editor') }, 'editor'), e('button', { type: 'button', className: 'autofill', onClick: () => fill('viewer') }, 'viewer')),
          e('label', null, 'Username'),
          e('input', { value: username, onChange: e => setUsername(e.target.value) }),
          e('label', null, 'Password'),
          e('input', { type: 'password', value: password, onChange: e => setPassword(e.target.value) }),
          error && e('div', { style: { color: 'red' } }, error),
          e('button', { type: 'submit' }, 'Sign in')
        );
      }

      function PostComposer({ token, platform }) {
        const [content, setContent] = React.useState('');
        const [status, setStatus] = React.useState(null);

        // guard: if token expired or missing, handle on server response

        async function submit(e) {
          e.preventDefault();
          setStatus(null);
          try {
            const res = await fetch('/api/posts', {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
              body: JSON.stringify({ content, platform })
            });
            const body = await res.json();
            if (!res.ok) throw new Error(body.error || 'Post failed');
            setContent('');
            setStatus('Posted successfully');
            window.dispatchEvent(new CustomEvent('posts:refresh'));
          } catch (err) {
            setStatus('Error: ' + err.message);
          }
        }

        return e('form', { onSubmit: submit, className: 'card' },
          e('h3', null, 'Compose Post (protected)'),
          e('textarea', { rows: 4, value: content, onChange: e => setContent(e.target.value) }),
          e('button', { type: 'submit' }, 'Post'),
          status && e('div', null, status)
        );
      }

      function PostList({ token }) {
        const [posts, setPosts] = React.useState([]);

        async function load() {
          try {
            const res = await fetch('/api/posts', { headers: { 'Authorization': `Bearer ${token}` } });
            const body = await res.json();
            if (!res.ok) throw new Error(body.error || 'Failed to load posts');
            setPosts(body.posts || []);
          } catch (err) {
            console.error(err);
          }
        }

        React.useEffect(() => {
          load();
          const handler = () => load();
          window.addEventListener('posts:refresh', handler);
          return () => window.removeEventListener('posts:refresh', handler);
        }, [token]);

        return e('div', { className: 'card' },
          e('h3', null, 'Posts'),
          posts.length === 0 ? e('div', null, 'No posts yet') : posts.map(p =>
            e('div', { key: p.id, style: { borderBottom: '1px solid #eee', padding: '.5rem 0' } },
              e('div', null, e('strong', null, p.name), ' ', e('small', null, `@${p.author}`), p.platform && e('span', { className: 'role-badge', style: { marginLeft: '8px' } }, p.platform)),
              e('div', null, p.content),
              e('div', null, e('small', null, new Date(p.createdAt).toLocaleString()))
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
