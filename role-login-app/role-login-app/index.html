<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role-Based Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <!-- View 1: login form -->
    <section id="login-view">
      <h1>Sign in</h1>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="e.g. priya" autocomplete="off">
      <p id="error" class="error" role="alert" hidden></p>
      <div class="row">
        <button id="btn-admin" class="primary">Login as Admin</button>
        <button id="btn-viewer">Login as Viewer</button>
      </div>
    </section>

    <!-- View 2: dashboard (shown after login) -->
    <section id="dashboard-view" hidden>
      <h1 id="welcome"></h1>
      <div id="admin-panel" hidden>
        <form id="post-form">
          <label for="post-content">Write a post</label>
          <textarea id="post-content" rows="4" placeholder="What's on your mind?" required></textarea>
          <button class="primary" type="submit">Publish post</button>
        </form>
      </div>
      <p id="viewer-panel" class="readonly" hidden>Read-only access</p>
      <section class="posts-section" aria-labelledby="posts-heading">
        <h2 id="posts-heading">Posts</h2>
        <div id="posts-list" aria-live="polite"></div>
      </section>
      <p id="status" class="status" aria-live="polite"></p>
      <button id="btn-logout" class="link">Logout</button>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
